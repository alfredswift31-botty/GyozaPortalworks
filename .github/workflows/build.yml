name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag, e.g. v1.1. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # Ad-hoc signing ("-") so CI needs no certificates. Hardened runtime is
      # off for tests only: its library validation rejects the ad-hoc test
      # bundle injected into the ad-hoc host app.
      - name: Unit tests
        run: |
          xcodebuild test \
            -project GyozaPortalworks.xcodeproj \
            -scheme GyozaPortalworks \
            -only-testing:GyozaPortalworksTests \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO

      # The views that follow the running CPU, built with the Release
      # optimizer the shipped app uses: a stale display can hide in -O only.
      - name: Live monitoring tests (Release build)
        if: always()
        run: |
          xcodebuild test \
            -project GyozaPortalworks.xcodeproj \
            -scheme GyozaPortalworks \
            -configuration Release \
            -only-testing:GyozaPortalworksTests/LiveMonitoringTests \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/ReleaseLiveTests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO ENABLE_TESTABILITY=YES

      # xcodebuild's log names a failing test but not what failed in it.
      - name: Show test failures
        if: failure()
        run: |
          for RESULT in "$RUNNER_TEMP/UnitTests.xcresult" "$RUNNER_TEMP/ReleaseLiveTests.xcresult"; do
            [ -d "$RESULT" ] || continue
            echo "== $(basename "$RESULT")"
            xcrun xcresulttool get test-results summary --path "$RESULT" > "$RUNNER_TEMP/summary.json"
            python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          failures = summary.get("testFailures", [])
          for failure in failures:
              print(f"FAILED {failure.get('testIdentifierString') or failure.get('testName')}")
              print(f"  {failure.get('failureText')}")
          if not failures:
              print(f"{summary.get('result')}: {summary.get('passedTests')} passed, {summary.get('failedTests')} failed")
          PY
          done

      # The snapshot tests render the real views; keep the PNGs for review.
      - name: Collect UI snapshots
        if: always()
        run: |
          mkdir -p ui-snapshots
          find "$HOME/Library/Containers" "$TMPDIR" -path '*ui-snapshots*' -name '*.png' -exec cp {} ui-snapshots/ \; 2>/dev/null || true
          ls -la ui-snapshots
          # Also print reduced JPEGs into the log, for review where artifacts can't be fetched.
          for f in ui-snapshots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .png)
            sips -Z 1400 -s format jpeg -s formatOptions 70 "$f" --out "/tmp/$name.jpg" >/dev/null
            echo "SNAPSHOT-BEGIN $name"
            base64 -i "/tmp/$name.jpg" | tr -d '\n' | fold -w 4000 | sed 's/^/SNAPSHOT-DATA /'
            echo
            echo "SNAPSHOT-END $name"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: ui-snapshots
          if-no-files-found: ignore

      - name: Build release app
        run: |
          xcodebuild build \
            -project GyozaPortalworks.xcodeproj \
            -target GyozaPortalworks \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      # Facts the app depends on at runtime that no unit test can see.
      - name: Verify the built app
        run: |
          APP=build/Release/GyozaPortalworks.app
          echo "== Entitlements =="
          codesign -d --entitlements - --xml "$APP" > entitlements.plist
          for key in com.apple.security.app-sandbox com.apple.security.files.user-selected.read-write; do
            grep -q "$key" entitlements.plist || { echo "Missing entitlement $key"; exit 1; }
          done
          echo "== App icon =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns" || test -f "$APP/Contents/Resources/Assets.car" \
            || { echo "No compiled app icon"; exit 1; }
          ls -la "$APP/Contents/Resources"
          echo "== Minimum macOS =="
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Package
        run: |
          codesign --verify --deep --strict build/Release/GyozaPortalworks.app
          ditto -c -k --keepParent build/Release/GyozaPortalworks.app GyozaPortalworks.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GyozaPortalworks
          path: GyozaPortalworks.zip

  # Runs for a pushed v* tag, or a manual run given a release tag (GitHub
  # then creates the tag on the built commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GyozaPortalworks

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          gh release create "$TAG" GyozaPortalworks.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GyozaPortalworks ${TAG#v}" \
            --generate-notes
